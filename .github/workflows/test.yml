name: glob pattern tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: checkout repository
      uses: actions/checkout@v4

    - name: setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: setup node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: install test dependencies
      run: pnpm add tiny-glob

    - name: execute glob pattern tests
      run: node index.mjs
      continue-on-error: true

    - name: debug test artifacts on failure
      if: failure()
      run: |
        echo "Directory listing"
        ls -la || dir
        echo "Test fixtures check"
        if [ -d "test-fixtures" ]; then find test-fixtures -type f | head -20; fi || true
      shell: bash
